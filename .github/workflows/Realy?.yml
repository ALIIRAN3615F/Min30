
name: Debian

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    timeout-minutes: 360

    steps:
      - name: 1. Install Desktop & RDP
        shell: bash
        run: |
          set -eu
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 xfce4-goodies xrdp xorgxrdp \
            xserver-xorg-legacy dbus dbus-x11 sudo \
            curl wget ca-certificates iproute2 procps \
            mesa-utils libgl1-mesa-dri libglx-mesa0 \
            libegl1 libgbm1 libgles2 libgl1

      - name: 2. Create Admin Account
        shell: bash
        run: |
          set -eu

          useradd -m -s /bin/bash NvDAdmin || true
          echo 'NvDAdmin:P@ssw0rd1qazXSW@#' | chpasswd
          usermod -aG sudo,ssl-cert NvDAdmin

          echo 'startxfce4' > /home/NvDAdmin/.xsession
          chown NvDAdmin:NvDAdmin /home/NvDAdmin/.xsession
          chmod 644 /home/NvDAdmin/.xsession

          mkdir -p /run/dbus /run/xrdp
          dbus-daemon --system --fork || true

          if [ -f /etc/X11/Xwrapper.config ]; then
            if grep -q '^allowed_users=' /etc/X11/Xwrapper.config; then
              sed -i 's/^allowed_users=.*/allowed_users=anybody/' \
                /etc/X11/Xwrapper.config
            else
              echo 'allowed_users=anybody' >> /etc/X11/Xwrapper.config
            fi
          else
            echo 'allowed_users=anybody' > /etc/X11/Xwrapper.config
          fi

          if [ -f /etc/xrdp/key.pem ]; then
            adduser xrdp ssl-cert || true
            chown root:ssl-cert /etc/xrdp/key.pem
            chmod 640 /etc/xrdp/key.pem
          fi

          chown xrdp:xrdp /run/xrdp

          /usr/sbin/xrdp-sesman
          /usr/sbin/xrdp

          sleep 3

          ss -ltnp | grep ':3389'

      - name: 3. Install & Connect Tailscale VPN
        shell: bash
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -eu

          if [ -z "${TAILSCALE_AUTHKEY:-}" ]; then
            echo "ERROR: TAILSCALE_AUTHKEY secret is missing."
            exit 1
          fi

          curl -fsSL https://tailscale.com/install.sh | sh

          mkdir -p /var/run/tailscale

          tailscaled \
            --tun=userspace-networking \
            --socket=/var/run/tailscale/tailscaled.sock \
            >/tmp/tailscaled.log 2>&1 &

          for i in $(seq 1 30); do
            if tailscale \
              --socket=/var/run/tailscale/tailscaled.sock \
              status >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          tailscale \
            --socket=/var/run/tailscale/tailscaled.sock \
            up \
            --auth-key="$TAILSCALE_AUTHKEY" \
            --hostname=debian-rdp-server

          sleep 8

          ts_ip=$(tailscale \
            --socket=/var/run/tailscale/tailscaled.sock ip -4)

          echo "=========================================="
          echo "  >>> DEBIAN RDP ENVIRONMENT <<<"
          echo "  Tailscale IP : $ts_ip"
          echo "  Username     : NvDAdmin"
          echo "  Password     : P@ssw0rd1qazXSW@#"
          echo "  RDP Port     : 3389"
          echo "=========================================="

      - name: 4. TEST & Debug RDP
        shell: bash
        run: |
          for i in $(seq 1 10); do
            sleep 60
            echo "========== XRDP DEBUG $i =========="
            tail -n 80 /var/log/xrdp.log 2>/dev/null || true
            tail -n 120 /var/log/xrdp-sesman.log 2>/dev/null || true
            ps aux | grep -E 'xrdp|Xorg|xfce|Xsession' |
              grep -v grep || true
          done

      - name: 5. Install and Launch Chrome with WebGL
        shell: bash
        run: |
          set -eu

          wget -O /tmp/google-chrome.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          apt-get install -y /tmp/google-chrome.deb

          mkdir -p /home/NvDAdmin/.config/google-chrome
          chown -R NvDAdmin:NvDAdmin /home/NvDAdmin/.config

          # Wait for the user's XRDP desktop session.
          for i in $(seq 1 60); do
            if pgrep -u NvDAdmin -f 'xfce4-session' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          # Launch Chrome with software WebGL rendering.
          runuser -u NvDAdmin -- \
            env DISPLAY=:10 \
            google-chrome-stable \
            --no-sandbox \
            --use-gl=angle \
            --use-angle=swiftshader \
            --enable-webgl \
            --disable-dev-shm-usage \
            --no-first-run \
            --no-default-browser-check \
            --user-data-dir=/home/NvDAdmin/.config/google-chrome \
            >/home/NvDAdmin/chrome.log 2>&1 &

          echo "Chrome launch command submitted."

      - name: 6. TEST
        shell: bash
        run: |
          for i in $(seq 1 2880); do
            sleep 60
            echo "[$i/2880] Server running..."
          done
