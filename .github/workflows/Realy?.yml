
name: Headless Eaglan Host (Tailscale)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: eaglan-host-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Download Eaglan Host
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/eaglan-download"

          curl --fail --location --retry 3 --retry-delay 2 \
            'https://download1585.mediafire.com/xrxnj0tioz6gf18Pd27WqeUimmp42wrT7jYPllDZUqIrYNWTrjNx_RjQtvgHfONXuyMqwO3FmnyW2v9wcT8HxsMlXZxT6qK7V2p2Jd9WPaA3JAm9tFpBNrOhbmw4kZ1xa_rqG6VNVRNN2fUwyOx16vsZWasKgwUstUlXnmdB_4cU/92a333eltq41enr/eaglan-host-linux.zip' \
            -o "$RUNNER_TEMP/eaglan-host-linux.zip"

          unzip -q "$RUNNER_TEMP/eaglan-host-linux.zip" \
            -d "$RUNNER_TEMP/eaglan-download"

          PROJECT_DIR="$(find "$RUNNER_TEMP/eaglan-download" \
            -type f -name cli.js -print -quit | xargs -r dirname)"

          if [[ -z "$PROJECT_DIR" || ! -f "$PROJECT_DIR/package.json" ]]; then
            echo "Eaglan Host project not found."
            exit 1
          fi

          echo "EAGLAN_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$EAGLAN_PROJECT_DIR"
          npm ci --omit=dev
          node -e "require('node:sqlite'); console.log('SQLite OK')"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Start host, save world, and restart workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$EAGLAN_PROJECT_DIR"

          export PORT=8090
          export BIND=127.0.0.1
          export EAGLAN_DATA="$GITHUB_WORKSPACE/.eaglan-data"
          export EAGLAN_STOP_HOST_ON_EXIT=1

          mkdir -p "$EAGLAN_DATA"

          node cli.js ui > "$RUNNER_TEMP/eaglan-ui.log" 2>&1 &
          UI_PID=$!

          cleanup() {
            kill -TERM "$UI_PID" 2>/dev/null || true
            sleep 3
            tailscale serve reset >/dev/null 2>&1 || true
          }
          trap cleanup EXIT INT TERM

          READY=0
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8090/ >/dev/null; then
              READY=1
              break
            fi

            if ! kill -0 "$UI_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/eaglan-ui.log"
              exit 1
            fi
            sleep 2
          done

          if [[ "$READY" != 1 ]]; then
            cat "$RUNNER_TEMP/eaglan-ui.log"
            echo "Eaglan UI failed to start."
            exit 1
          fi

          tailscale serve --bg http://127.0.0.1:8090
          tailscale serve status

          echo "Open the Tailscale HTTPS address above."
          echo "Select or import your world, then click Host."

          # Run for 5 hours 35 minutes, below the job timeout.
          sleep 335m

          echo "Stopping Eaglan to save the world..."
          kill -TERM "$UI_PID" 2>/dev/null || true

          for _ in $(seq 1 60); do
            if ! kill -0 "$UI_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if kill -0 "$UI_PID" 2>/dev/null; then
            echo "ERROR: UI did not exit gracefully; refusing to commit potentially inconsistent world data."
            cat "$RUNNER_TEMP/eaglan-ui.log"
            exit 1
          fi

          wait "$UI_PID" || true
          tailscale serve reset >/dev/null 2>&1 || true

          cd "$GITHUB_WORKSPACE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f .eaglan-data

          if ! git diff --cached --quiet; then
            git commit -m "Save Eaglan world data"
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "No world data changes to commit."
          fi

          # Dispatch the next run using the built-in GITHUB_TOKEN.
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/eaglan-host.yml/dispatches" \
            -f ref="$GITHUB_REF_NAME"

          echo "Save completed; next workflow run requested."
