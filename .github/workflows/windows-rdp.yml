
name: Debian Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    timeout-minutes: 360

    steps:
      - name: 1. Install Desktop & RDP
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 xfce4-goodies xrdp dbus-x11 sudo curl ca-certificates


      - name: 2. Create Admin Account
        run: |
          apt-get install -y xfce4 xfce4-goodies xorgxrdp xrdp dbus-x11
          useradd -m -s /bin/bash NvDAdmin || true
          echo 'NvDAdmin:P@ssw0rd1qazXSW@#' | chpasswd
          usermod -aG sudo,ssl-cert NvDAdmin

          echo 'startxfce4' > /home/NvDAdmin/.xsession
          chown NvDAdmin:NvDAdmin /home/NvDAdmin/.xsession
          chmod 644 /home/NvDAdmin/.xsession

          mkdir -p /run/dbus
          dbus-daemon --system --fork || true

          service xrdp restart

          echo "XRDP session configured for NvDAdmin"


      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          tailscaled --tun=userspace-networking &
          sleep 5
          tailscale up \
            --auth-key="$TAILSCALE_AUTHKEY" \
            --hostname="debian-rdp-server"
          sleep 8
          ts_ip=$(tailscale ip -4)

          echo "=================================================="
          echo "  >>> DEBIAN RDP ENVIRONMENT <<<"
          echo "  Tailscale IP : $ts_ip"
          echo "  Username     : NvDAdmin"
          echo "  Password     : P@ssw0rd1qazXSW@#"
          echo "  RDP Port     : 3389"
          echo "=================================================="

      - name: 4. TEST
        run: |
          for i in $(seq 1 2880); do
            sleep 60
            echo "[$i/2880] Server running..."
          done
