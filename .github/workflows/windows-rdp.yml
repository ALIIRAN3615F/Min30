
name: Debian Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    timeout-minutes: 360

    steps:
      - name: 1. Install Desktop & RDP
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 xfce4-goodies xorgxrdp xrdp \
            dbus-x11 dbus sudo curl ca-certificates \
            iproute2 procps

      - name: 2. Create Admin Account & Configure XRDP
        run: |
          useradd -m -s /bin/bash NvDAdmin || true
          echo 'NvDAdmin:P@ssw0rd1qazXSW@#' | chpasswd
          usermod -aG sudo,ssl-cert NvDAdmin

          echo 'startxfce4' > /home/NvDAdmin/.xsession
          chown NvDAdmin:NvDAdmin /home/NvDAdmin/.xsession
          chmod 644 /home/NvDAdmin/.xsession

          mkdir -p /run/dbus
          dbus-daemon --system --fork || true

          adduser xrdp ssl-cert || true
          chown root:ssl-cert /etc/xrdp/key.pem
          chmod 640 /etc/xrdp/key.pem

          install -d -o xrdp -g xrdp /run/xrdp
          service xrdp-sesman start
          service xrdp start

          echo "XRDP configured for NvDAdmin"

      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if [ -z "$TAILSCALE_AUTHKEY" ]; then
            echo "ERROR: TAILSCALE_AUTHKEY secret is missing."
            exit 1
          fi

          curl -fsSL https://tailscale.com/install.sh | sh

          mkdir -p /var/run/tailscale
          tailscaled \
            --tun=userspace-networking \
            --socket=/var/run/tailscale/tailscaled.sock \
            > /tmp/tailscaled.log 2>&1 &

          for i in $(seq 1 30); do
            if tailscale --socket=/var/run/tailscale/tailscaled.sock status >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          tailscale \
            --socket=/var/run/tailscale/tailscaled.sock \
            up --auth-key="$TAILSCALE_AUTHKEY" \
            --hostname="debian-rdp-server"

          sleep 8

          echo "Tailscale status:"
          tailscale --socket=/var/run/tailscale/tailscaled.sock status

          echo "Tailscale IP:"
          tailscale --socket=/var/run/tailscale/tailscaled.sock ip -4

      - name: 4. RDP Diagnostics
        run: |
          echo "===== XRDP SERVICES ====="
          service xrdp status || true
          service xrdp-sesman status || true

          echo "===== XRDP TLS KEY ====="
          ls -l /etc/xrdp/cert.pem /etc/xrdp/key.pem || true

          echo "===== XRDP LOG ====="
          tail -n 100 /var/log/xrdp.log 2>/dev/null || true

          echo "===== SESMAN LOG ====="
          tail -n 100 /var/log/xrdp-sesman.log 2>/dev/null || true

          echo "===== LISTENING PORTS ====="
          ss -lntp || true

          echo "===== KEEP RUNNER ALIVE ====="
          for i in $(seq 1 360); do
            sleep 60
            echo "[$i/360] Runner running..."

            if [ $((i % 5)) -eq 0 ]; then
              tail -n 30 /var/log/xrdp.log 2>/dev/null || true
              tail -n 30 /var/log/xrdp-sesman.log 2>/dev/null || true
            fi
          done

