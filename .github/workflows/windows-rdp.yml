```yaml
name: Debian Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Install Debian
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget sudo openssh-server

      - name: 2. Install Desktop and RDP
        run: |
          sudo apt-get install -y xfce4 xfce4-goodies xrdp
          sudo systemctl enable --now xrdp

      - name: 3. Create Admin Account
        run: |
          sudo useradd -m -s /bin/bash NvDAdmin || true
          echo 'NvDAdmin:CHANGE_THIS_PASSWORD' | sudo chpasswd
          sudo usermod -aG sudo NvDAdmin
          sudo adduser xrdp ssl-cert || true

      - name: 4. Install & Connect Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --auth-key="$TAILSCALE_AUTHKEY" --hostname="debian-rdp-server"

          sleep 8

          TS_IP=$(tailscale ip -4)

          echo "=========================================="
          echo "Debian RDP Server"
          echo "Tailscale IP: $TS_IP"
          echo "Username: NvDAdmin"
          echo "RDP Port: 3389"
          echo "=========================================="

      - name: 5. Keep Runner Alive
        run: |
          for i in $(seq 1 2880); do
            sleep 60
            echo "[$i/2880] Runner running..."
          done
```
