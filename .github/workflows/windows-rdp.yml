
name: Debian Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    timeout-minutes: 360

    steps:
      - name: 1. Install Desktop, RDP and Chrome Dependencies
        shell: bash
        run: |
          set -eu
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            xorgxrdp \
            xserver-xorg-legacy \
            dbus \
            dbus-x11 \
            sudo \
            curl \
            ca-certificates \
            iproute2 \
            procps \
            grep \
            sed \
            wget

      - name: 2. Create User and Configure Desktop
        shell: bash
        run: |
          set -eu

          id NvDAdmin >/dev/null 2>&1 || \
            useradd -m -s /bin/bash NvDAdmin

          echo 'NvDAdmin:P@ssw0rd1qazXSW@#' | chpasswd
          usermod -aG sudo,ssl-cert NvDAdmin

          printf '%s\n' 'startxfce4' \
            > /home/NvDAdmin/.xsession

          chown NvDAdmin:NvDAdmin /home/NvDAdmin/.xsession
          chmod 644 /home/NvDAdmin/.xsession

          mkdir -p /run/dbus /run/xrdp
          dbus-daemon --system --fork || true

          if [ -f /etc/X11/Xwrapper.config ]; then
            if grep -q '^allowed_users=' /etc/X11/Xwrapper.config; then
              sed -i 's/^allowed_users=.*/allowed_users=anybody/' \
                /etc/X11/Xwrapper.config
            else
              echo 'allowed_users=anybody' >> /etc/X11/Xwrapper.config
            fi
          else
            printf '%s\n' 'allowed_users=anybody' \
              > /etc/X11/Xwrapper.config
          fi

          if [ -f /etc/xrdp/key.pem ]; then
            adduser xrdp ssl-cert || true
            chown root:ssl-cert /etc/xrdp/key.pem
            chmod 640 /etc/xrdp/key.pem
          fi

          chown xrdp:xrdp /run/xrdp

      - name: 3. Start XRDP
        shell: bash
        run: |
          set -eu

          mkdir -p /run/xrdp
          chown xrdp:xrdp /run/xrdp

          /usr/sbin/xrdp-sesman
          /usr/sbin/xrdp

          sleep 3

          if ! ss -ltnp | grep -q ':3389'; then
            echo "XRDP failed to listen on port 3389."
            exit 1
          fi

      - name: 4. Install and Connect Tailscale
        shell: bash
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -eu

          if [ -z "${TAILSCALE_AUTHKEY:-}" ]; then
            echo "ERROR: TAILSCALE_AUTHKEY secret is missing."
            exit 1
          fi

          curl -fsSL https://tailscale.com/install.sh | sh

          mkdir -p /var/run/tailscale

          tailscaled \
            --tun=userspace-networking \
            --socket=/var/run/tailscale/tailscaled.sock \
            >/tmp/tailscaled.log 2>&1 &

          for i in $(seq 1 30); do
            if tailscale \
              --socket=/var/run/tailscale/tailscaled.sock \
              status >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          tailscale \
            --socket=/var/run/tailscale/tailscaled.sock \
            up \
            --auth-key="$TAILSCALE_AUTHKEY" \
            --hostname=debian-rdp-server

          sleep 5

          echo "=========================================="
          echo "       DEBIAN CLOUD RDP"
          echo "=========================================="
          echo "Tailscale IP:"
          tailscale \
            --socket=/var/run/tailscale/tailscaled.sock \
            ip -4
          echo "Username: NvDAdmin"
          echo "Password: P@ssw0rd1qazXSW@#"
          echo "RDP Port: 3389"
          echo "=========================================="

      - name: 5. Install Google Chrome
        shell: bash
        run: |
          set -eu

          wget -O /tmp/google-chrome.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          apt-get install -y /tmp/google-chrome.deb

          mkdir -p /home/NvDAdmin/.config/google-chrome
          chown -R NvDAdmin:NvDAdmin /home/NvDAdmin/.config

      - name: 6. Launch Chrome and Keep Alive
        shell: bash
        run: |
          set -eu

          # Wait for the RDP graphical session to become available.
          for i in $(seq 1 60); do
            if pgrep -u NvDAdmin -f 'xfce4-session|xfce4-session' >/dev/null; then
              break
            fi
            sleep 2
          done

          # Launch Chrome in the user's graphical session.
          runuser -u NvDAdmin -- \
            env DISPLAY=:10 \
            google-chrome-stable \
            --no-sandbox \
            --disable-gpu \
            --no-first-run \
            --no-default-browser-check \
            --user-data-dir=/home/NvDAdmin/.config/google-chrome \
            >/home/NvDAdmin/chrome.log 2>&1 &

          echo "Chrome launch command submitted."

          for i in $(seq 1 2000); do
            sleep 60
            echo "[$i/2000] Debian RDP is running."
          done
