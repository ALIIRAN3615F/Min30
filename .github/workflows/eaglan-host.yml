
name: Headless Eaglan Host (Tailscale)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: eaglan-host-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Download Eaglan Host
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/eaglan-download"

          curl --fail --location --retry 3 --retry-delay 2 \
            'https://download937.mediafire.com/0rjhq20mz8ygi7a1KRpCZKyk2JnP8PxQCiKZACjBKPR5u2yY84SEF5F0qKq08GSMK8Vp7M0NYMaqM5smLIvyZX-hSWZKJIJLQDh5nZzeSGnDQ8HOG-OnS7iztOpnSlHQjZDxmNx8U3oH7QKwhV2HQCAP9vL44HZMnYvT4Tgznu9Wb_wb/5yf2efl5duy3lgl/eaglan-host-linux.zip' \
            -o "$RUNNER_TEMP/eaglan-host-linux.zip"

          unzip -q "$RUNNER_TEMP/eaglan-host-linux.zip" \
            -d "$RUNNER_TEMP/eaglan-download"

          PROJECT_DIR="$(find "$RUNNER_TEMP/eaglan-download" \
            -type f -name cli.js -print -quit | xargs -r dirname)"

          if [[ -z "$PROJECT_DIR" || ! -f "$PROJECT_DIR/package.json" ]]; then
            echo "Eaglan Host project not found."
            exit 1
          fi

          echo "EAGLAN_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$EAGLAN_PROJECT_DIR"

          npm ci --omit=dev
          node -e "require('node:sqlite'); console.log('SQLite OK')"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          statedir: /tmp/tailscale-state

      - name: Start host, save world, and restart workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$EAGLAN_PROJECT_DIR"

          export PORT=8090
          export BIND=127.0.0.1
          export EAGLAN_DATA="$GITHUB_WORKSPACE/.eaglan-data"
          export EAGLAN_STOP_HOST_ON_EXIT=1

          mkdir -p "$EAGLAN_DATA"

          UI_PID=""

          cleanup() {
            if [[ -n "$UI_PID" ]]; then
              kill -TERM "$UI_PID" 2>/dev/null || true
              wait "$UI_PID" 2>/dev/null || true
            fi

            sudo tailscale serve reset >/dev/null 2>&1 || true
          }

          trap cleanup EXIT INT TERM

          node cli.js ui > "$RUNNER_TEMP/eaglan-ui.log" 2>&1 &
          UI_PID=$!

          READY=0

          for _ in $(seq 1 45); do
            if curl -fsS --connect-timeout 2 --max-time 5 \
              http://127.0.0.1:8090/ >/dev/null; then
              READY=1
              break
            fi

            if ! kill -0 "$UI_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/eaglan-ui.log"
              exit 1
            fi

            sleep 2
          done

          if [[ "$READY" != 1 ]]; then
            cat "$RUNNER_TEMP/eaglan-ui.log"
            echo "Eaglan UI failed to start."
            exit 1
          fi

          TS_DNS="$(tailscale status --json | node -e '
            let s = "";
            process.stdin.on("data", d => s += d);
            process.stdin.on("end", () => {
              try {
                process.stdout.write(
                  (JSON.parse(s).Self.DNSName || "").replace(/\.$/, "")
                );
              } catch {}
            });
          ')"

          if [[ -z "$TS_DNS" ]]; then
            echo "Unable to determine Tailscale DNS name."
            exit 1
          fi

          sudo tailscale serve reset
          sudo tailscale serve --bg http://127.0.0.1:8090

          echo "========== EAGLAN HOST READY =========="
          echo "HTTPS_URL=https://$TS_DNS/"
          echo "Open this address while the workflow is running."
          echo "Tailscale must be connected on your client device."
          echo "Select or import your world, then click Host."

          # Run for 5 hours 35 minutes, below the job timeout.
          sleep 335m

          echo "Stopping Eaglan to save the world..."

          kill -TERM "$UI_PID" 2>/dev/null || true

          GRACEFUL=0

          for _ in $(seq 1 60); do
            if ! kill -0 "$UI_PID" 2>/dev/null; then
              GRACEFUL=1
              break
            fi
            sleep 1
          done

          if [[ "$GRACEFUL" != 1 ]]; then
            echo "ERROR: UI did not exit gracefully."
            cat "$RUNNER_TEMP/eaglan-ui.log"
            exit 1
          fi

          wait "$UI_PID" || true
          UI_PID=""

          sudo tailscale serve reset >/dev/null 2>&1 || true

          cd "$GITHUB_WORKSPACE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f .eaglan-data

          if ! git diff --cached --quiet; then
            git commit -m "Save Eaglan world data"
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "No world data changes to commit."
          fi

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/eaglan-host.yml/dispatches" \
            -f ref="$GITHUB_REF_NAME"

          echo "Save completed; next workflow run requested."
