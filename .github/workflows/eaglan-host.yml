
name: Headless Eaglan Host (Tailscale + Portwarp UDP)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: eaglan-host-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Download Eaglan Host
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/eaglan-download"

          curl --fail --location --retry 3 --retry-delay 2 \
            'https://thoughtful-rose-tahr.myfilebase.com/ipfs/QmXeJeA4PDTaRPjKxjaFpJZYHJNnyaxPByCoMczybsepfY' \
            -o "$RUNNER_TEMP/eaglan-host-linux.zip"

          unzip -q "$RUNNER_TEMP/eaglan-host-linux.zip" \
            -d "$RUNNER_TEMP/eaglan-download"

          PROJECT_DIR="$(find "$RUNNER_TEMP/eaglan-download" \
            -type f -name cli.js -print -quit | xargs -r dirname)"

          if [[ -z "$PROJECT_DIR" || ! -f "$PROJECT_DIR/package.json" ]]; then
            echo "Eaglan Host project not found."
            exit 1
          fi

          echo "EAGLAN_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$EAGLAN_PROJECT_DIR"

          npm ci --omit=dev
          node -e "require('node:sqlite'); console.log('SQLite OK')"

      - name: Install Portwarp CLI
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --retry 3 \
            https://portwarp.com/download/install.sh | bash

          command -v pwrp
          pwrp version

      - name: Portwarp Login - Approve in Chrome
        shell: bash
        timeout-minutes: 10
        run: |
          set -uo pipefail

          echo "============================================"
          echo "PORTWARP DEVICE LOGIN"
          echo "Open the URL shown below in Chrome."
          echo "Enter the displayed code and approve the device."
          echo "Keep this step running until approved."
          echo "============================================"

          set +e
          pwrp login 2>&1 | tee "$RUNNER_TEMP/portwarp-login.log"
          LOGIN_STATUS=${PIPESTATUS[0]}
          set -e

          if [[ "$LOGIN_STATUS" -ne 0 ]]; then
            echo "Portwarp login failed."
            exit "$LOGIN_STATUS"
          fi

          pwrp status
          pwrp tunnels

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          statedir: /tmp/tailscale-state

      - name: Start Eaglan, connect UDP, save world and restart
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$EAGLAN_PROJECT_DIR"

          export PORT=8090
          export BIND=127.0.0.1
          export EAGLAN_DATA="$GITHUB_WORKSPACE/.eaglan-data"
          export EAGLAN_STOP_HOST_ON_EXIT=1

          mkdir -p "$EAGLAN_DATA"

          UI_PID=""
          TUNNEL_STARTED=0

          cleanup() {
            if [[ "$TUNNEL_STARTED" == 1 ]]; then
              pwrp stop --all >/dev/null 2>&1 || true
            fi

            if [[ -n "$UI_PID" ]]; then
              kill -TERM "$UI_PID" 2>/dev/null || true
              wait "$UI_PID" 2>/dev/null || true
            fi

            sudo tailscale serve reset >/dev/null 2>&1 || true
          }

          trap cleanup EXIT INT TERM

          # Start Eaglan UI
          node cli.js ui > "$RUNNER_TEMP/eaglan-ui.log" 2>&1 &
          UI_PID=$!

          READY=0

          for _ in $(seq 1 45); do
            if curl -fsS --connect-timeout 2 --max-time 5 \
              http://127.0.0.1:8090/ >/dev/null; then
              READY=1
              break
            fi

            if ! kill -0 "$UI_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/eaglan-ui.log"
              exit 1
            fi

            sleep 2
          done

          if [[ "$READY" != 1 ]]; then
            cat "$RUNNER_TEMP/eaglan-ui.log"
            echo "Eaglan UI failed to start."
            exit 1
          fi

          echo "Eaglan UI is responding on port 8090."

          # Display the actual Portwarp tunnel list before connecting.
          echo "========== PORTWARP TUNNELS =========="
          pwrp tunnels

          echo "========== CONNECTING ENABLED TUNNELS =========="

          # Connect enabled tunnels using Portwarp's own selection.
          # This avoids relying on the incorrect name "Eaglan UDP".
          pwrp connect --all --detach
          TUNNEL_STARTED=1

          sleep 8

          echo "========== PORTWARP SESSION STATUS =========="
          pwrp ps --once

          # Require at least one running session.
          SESSION_OUTPUT="$(pwrp ps --once 2>&1)" || {
            echo "$SESSION_OUTPUT"
            echo "Unable to query Portwarp sessions."
            exit 1
          }

          echo "$SESSION_OUTPUT"

          if echo "$SESSION_OUTPUT" | grep -Eiq \
            'No running sessions|0 running sessions'; then
            echo "ERROR: No Portwarp tunnel session is active."
            exit 1
          fi

          # Configure the private Tailscale panel.
          TS_DNS="$(tailscale status --json | node -e '
            let s = "";
            process.stdin.on("data", d => s += d);
            process.stdin.on("end", () => {
              try {
                process.stdout.write(
                  (JSON.parse(s).Self.DNSName || "").replace(/\.$/, "")
                );
              } catch {}
            });
          ')"

          if [[ -z "$TS_DNS" ]]; then
            echo "Unable to determine Tailscale DNS name."
            exit 1
          fi

          sudo tailscale serve reset
          sudo tailscale serve --bg http://127.0.0.1:8090

          echo "========== EAGLAN HOST READY =========="
          echo "PRIVATE_PANEL=https://$TS_DNS/"
          echo "Configured UDP endpoint: uipr6edt.free.pwrp.cc:14533"
          echo "Panel access requires Tailscale."
          echo "Verify the UDP tunnel in Portwarp before inviting players."

          # Run below the GitHub Actions job timeout.
          sleep 335m

          echo "Stopping Eaglan to save the world..."

          kill -TERM "$UI_PID" 2>/dev/null || true

          GRACEFUL=0

          for _ in $(seq 1 60); do
            if ! kill -0 "$UI_PID" 2>/dev/null; then
              GRACEFUL=1
              break
            fi
            sleep 1
          done

          if [[ "$GRACEFUL" != 1 ]]; then
            echo "ERROR: Eaglan UI did not exit gracefully."
            cat "$RUNNER_TEMP/eaglan-ui.log"
            exit 1
          fi

          wait "$UI_PID" || true
          UI_PID=""

          if [[ "$TUNNEL_STARTED" == 1 ]]; then
            pwrp stop --all || true
            TUNNEL_STARTED=0
          fi

          sudo tailscale serve reset >/dev/null 2>&1 || true

          cd "$GITHUB_WORKSPACE"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f .eaglan-data

          if ! git diff --cached --quiet; then
            git commit -m "Save Eaglan world data"
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "No world data changes to commit."
          fi

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/eaglan-host.yml/dispatches" \
            -f ref="$GITHUB_REF_NAME"

          echo "Save completed; next workflow run requested."
