
name: Eaglan Host Debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Download Eaglan Host
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/eaglan-download"

          curl --fail --location --retry 3 --retry-delay 2 \
            'https://download1472.mediafire.com/7upnm1vm8sfg-Tg4C0UVgZdr_jbpyJBGzbUqB0vaTM0RkG13u74FG5P-5j4jFqjLC4Dzy_Zvy6sZTbVUhGBzEjwOOCxqNZ_iKtiJqy3hluRS-QvK8wu4b6hOF9mnlfzzuU5hPg6sDqa6BBoOIgqBSlvzd5QMm5MnKzqNgxPzA5GkNA/wak1e6dmdwnpzge/eaglan-host-linux%282%29.zip' \
            -o "$RUNNER_TEMP/eaglan-host-linux.zip"

          echo "========== ZIP VALIDATION =========="
          ls -lh "$RUNNER_TEMP/eaglan-host-linux.zip"
          file "$RUNNER_TEMP/eaglan-host-linux.zip"
          unzip -t "$RUNNER_TEMP/eaglan-host-linux.zip"

          unzip -q "$RUNNER_TEMP/eaglan-host-linux.zip" \
            -d "$RUNNER_TEMP/eaglan-download"

          PROJECT_DIR="$(find "$RUNNER_TEMP/eaglan-download" \
            -type f -name cli.js -print -quit | xargs -r dirname)"

          if [[ -z "$PROJECT_DIR" || ! -f "$PROJECT_DIR/package.json" ]]; then
            echo "ERROR: Eaglan project not found"
            find "$RUNNER_TEMP/eaglan-download" -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "EAGLAN_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$EAGLAN_PROJECT_DIR"
          node --version
          npm --version
          npm ci --omit=dev
          node -e "require('node:sqlite'); console.log('SQLITE_OK')"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Debug Eaglan HTTP and Tailscale HTTPS
        shell: bash
        run: |
          set -uo pipefail
          cd "$EAGLAN_PROJECT_DIR"

          export PORT=8090
          export BIND=127.0.0.1
          export EAGLAN_DATA="$GITHUB_WORKSPACE/.eaglan-data"
          export EAGLAN_STOP_HOST_ON_EXIT=1

          mkdir -p "$EAGLAN_DATA"

          UI_PID=""

          cleanup() {
            echo "========== CLEANUP =========="

            if [[ -n "$UI_PID" ]]; then
              kill -TERM "$UI_PID" 2>/dev/null || true

              for _ in $(seq 1 10); do
                kill -0 "$UI_PID" 2>/dev/null || break
                sleep 1
              done

              kill -KILL "$UI_PID" 2>/dev/null || true
              wait "$UI_PID" 2>/dev/null || true
            fi

            sudo tailscale serve reset >/dev/null 2>&1 || true

            echo "========== LAST 200 UI LOG LINES =========="
            tail -n 200 "$RUNNER_TEMP/eaglan-ui.log" 2>/dev/null || true
          }

          trap cleanup EXIT

          echo "========== SYSTEM =========="
          uname -a
          node --version
          npm --version
          tailscale version

          echo "PROJECT=$EAGLAN_PROJECT_DIR"
          echo "DATA=$EAGLAN_DATA"

          echo "========== START EAGLAN =========="
          node cli.js ui > "$RUNNER_TEMP/eaglan-ui.log" 2>&1 &
          UI_PID=$!

          READY=0

          for i in $(seq 1 45); do
            if curl -sS -f --connect-timeout 2 --max-time 5 \
              http://127.0.0.1:8090/ \
              -o "$RUNNER_TEMP/eaglan-response.html" \
              2>"$RUNNER_TEMP/eaglan-curl.log"; then
              READY=1
              echo "LOCAL_HTTP_READY=YES"
              echo "READY_ATTEMPT=$i"
              break
            fi

            if ! kill -0 "$UI_PID" 2>/dev/null; then
              echo "UI_PROCESS=EXITED"
              break
            fi

            sleep 2
          done

          echo "========== UI PROCESS =========="
          ps -p "$UI_PID" -o pid,stat,etime,args || true

          echo "========== LISTENING PORTS =========="
          sudo ss -ltnp || true

          echo "========== EAGLAN LOG =========="
          cat "$RUNNER_TEMP/eaglan-ui.log" || true

          if [[ "$READY" != 1 ]]; then
            echo "RESULT=LOCAL_HTTP_FAILED"
            exit 1
          fi

          echo "========== TAILSCALE STATUS =========="
          tailscale status || true
          tailscale ip -4 || true
          tailscale netcheck || true

          TS_DNS="$(tailscale status --json | node -e '
            let s = "";
            process.stdin.on("data", d => s += d);
            process.stdin.on("end", () => {
              try {
                process.stdout.write(
                  (JSON.parse(s).Self.DNSName || "").replace(/\.$/, "")
                );
              } catch {}
            });
          ')"

          echo "TAILSCALE_DNS=$TS_DNS"

          if [[ -z "$TS_DNS" ]]; then
            echo "RESULT=TAILSCALE_DNS_MISSING"
            exit 1
          fi

          echo "========== RESET OLD SERVE CONFIG =========="
          sudo tailscale serve reset || true

          echo "========== CONFIGURE SERVE =========="
          if ! sudo tailscale serve --bg http://127.0.0.1:8090; then
            echo "RESULT=TAILSCALE_SERVE_FAILED"
            sudo tailscale serve status || true
            exit 1
          fi

          echo "========== SERVE STATUS =========="
          sudo tailscale serve status || true
          sudo tailscale serve status --json || true

          echo "========== CERTIFICATE CHECK =========="

          set +e
          sudo tailscale cert "$TS_DNS" \
            > "$RUNNER_TEMP/tailscale-cert.log" 2>&1
          CERT_RESULT=$?
          set -e

          cat "$RUNNER_TEMP/tailscale-cert.log"
          echo "CERT_COMMAND_EXIT=$CERT_RESULT"

          echo "========== HTTPS TEST =========="

          set +e
          curl -v --connect-timeout 10 --max-time 20 \
            -o /dev/null \
            "https://$TS_DNS/" \
            > "$RUNNER_TEMP/https-test.log" 2>&1
          HTTPS_RESULT=$?
          set -e

          cat "$RUNNER_TEMP/https-test.log"
          echo "HTTPS_CURL_EXIT=$HTTPS_RESULT"

          echo "========== LOCAL HTTP TEST =========="

          set +e
          curl -v --connect-timeout 5 --max-time 10 \
            -o /dev/null \
            http://127.0.0.1:8090/ \
            > "$RUNNER_TEMP/local-http-test.log" 2>&1
          LOCAL_RESULT=$?
          set -e

          cat "$RUNNER_TEMP/local-http-test.log"
          echo "LOCAL_HTTP_CURL_EXIT=$LOCAL_RESULT"

          echo "========== KEEP SERVER RUNNING =========="
          echo "Open this URL while the workflow is running:"
          echo "https://$TS_DNS/"

          for i in $(seq 1 50); do
            if ! kill -0 "$UI_PID" 2>/dev/null; then
              echo "RESULT=UI_PROCESS_DIED"
              tail -n 200 "$RUNNER_TEMP/eaglan-ui.log" || true
              exit 1
            fi

            echo "HEALTH_CHECK=$i"

            curl -sS --connect-timeout 3 --max-time 5 \
              -o /dev/null \
              -w "LOCAL_HTTP_CODE=%{http_code}\n" \
              http://127.0.0.1:8090/ || true

            sleep 30
          done

          echo "RESULT=DEBUG_WINDOW_FINISHED"

